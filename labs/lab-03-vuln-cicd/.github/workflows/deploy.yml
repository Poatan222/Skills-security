# LAB-03: Deliberately Vulnerable GitHub Actions
# Tests: injection, mutable actions, secrets exposure, pull_request_target
# DO NOT USE — for skill testing only

name: Vulnerable Deploy Workflow

on:
  pull_request_target:        # VULN: runs with base repo secrets

permissions:
  contents: write             # VULN: overly permissive
  id-token: write             # VULN: OIDC token for all jobs
  actions: write              # VULN: can modify workflows

jobs:
  build:
    runs-on: self-hosted      # VULN: self-hosted on public repo

    steps:
      # VULN: mutable tag — not SHA-pinned
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # VULN: untrusted code

      # VULN: expression injection — PR title into run step
      - name: Print PR info
        run: |
          echo "PR title: ${{ github.event.pull_request.title }}"
          echo "Branch: ${{ github.head_ref }}"

      # VULN: hardcoded secret in env
      - name: Deploy
        env:
          API_KEY: "sk-prod-hardcoded-secret-12345"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET }}
        run: |
          npm install
          npm run build
          aws s3 sync dist/ s3://prod-bucket

      # VULN: secret passed to unvetted third-party action
      - uses: some-random-publisher/deploy-action@main
        with:
          api-key: ${{ secrets.PROD_API_KEY }}
